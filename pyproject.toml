[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free-dp"
version = "1.0.0"
description = "IDE skill and multi-agent deep research engine that pools free-tier smaller models to match frontier deep-research rigor."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "deep-research",
    "multi-agent",
    "ai-agents",
    "ide-skill",
    "claude-code",
    "codex",
    "cursor",
    "antigravity",
    "gemini",
    "groq",
    "openrouter",
    "arxiv",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "polars>=0.20.0",
    "boto3>=1.34.0",
    "pymupdf>=1.24.0",
    "trafilatura>=1.9.0",
    "json-repair>=0.25.0",
    "lancedb>=0.8.0",
    "pyarrow>=15.0.0",
    "sentence-transformers>=3.0.0",
    "flashrank>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/Ezhil948/free-dp"
Repository = "https://github.com/Ezhil948/free-dp.git"
Issues = "https://github.com/Ezhil948/free-dp/issues"

[project.scripts]
free-dp = "run_council:main"
show-dossier = "show_dossier:main"
